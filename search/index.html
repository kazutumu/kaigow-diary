---
layout: page
title: 日記を検索
kicker: Search
permalink: /search/
---

<div class="search-box">
  <label for="search-input">題名や本文に含まれる言葉</label>
  <div class="search-control">
    <input id="search-input" type="search" autocomplete="off" placeholder="例：夜勤、食事、研修">
    <button id="search-clear" type="button" aria-label="検索語を消す" title="検索語を消す">×</button>
  </div>
  <p id="search-status" role="status" aria-live="polite">検索語を入力してください。</p>
</div>
<div id="search-results" class="search-results"></div>

<script id="search-data" type="application/json">
[
  {% for post in site.posts %}
  {
    "title": {{ post.title | jsonify }},
    "url": {{ post.url | relative_url | jsonify }},
    "date": {{ post.date | date: '%Y年%-m月%-d日' | jsonify }},
    "categories": {{ post.categories | join: '・' | jsonify }},
    "text": {{ post.content | strip_html | strip_newlines | jsonify }}
  }{% unless forloop.last %},{% endunless %}
  {% endfor %}
]
</script>
<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
