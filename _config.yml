title: 介護福祉士の日記w
description: 介護福祉士として26年間働き、現在はソロビルダーとして本やサイト、ゲームなどを作る50代の個人ブログです。うつ病との付き合いや日常も記録しています。
lang: ja
timezone: Asia/Tokyo
url: "https://kazutumu.github.io"
baseurl: "/kaigow-diary"
permalink: /diary/:year/:month/:day/:title/
future: false

kramdown:
  hard_wrap: true

author:
  name: 介護福祉士の日記w

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - "**/* [0-9].*"
