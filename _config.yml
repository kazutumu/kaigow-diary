title: 介護福祉士の日記w
description: うつ病と付き合いながら介護職として生きる、日常と好奇心の個人ブログです。
lang: ja
timezone: Asia/Tokyo
url: "https://kazutumu.github.io"
baseurl: "/kaigow-diary"
permalink: /diary/:year/:month/:day/:title/
future: false

kramdown:
  hard_wrap: true

author:
  name: 介護福祉士の日記w

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - "_posts/* 2.md"
